<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Loan Repayment Wizard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #13294B;
    --navy-mid: #1d3d6e;
    --navy-light: #2a5298;
    --orange: #E84A27;
    --orange-light: #f5703d;
    --gold: #E8A020;
    --teal: #0B6E5E;
    --teal-light: #12947d;
    --bg: #F4F1EC;
    --surface: #FFFDF9;
    --text: #1a1a1a;
    --text-muted: #5a5a5a;
    --border: #D9D3C7;
    --step-w: 680px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ─── HEADER ─────────────────────────────────────────── */
  header {
    background: var(--navy);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header-badge {
    width: 42px; height: 42px;
    background: var(--orange);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 20px;
  }
  .header-title { color: white; font-family: 'DM Serif Display', serif; font-size: 1.35rem; }
  .header-sub { color: rgba(255,255,255,.55); font-size: 0.75rem; font-weight: 300; margin-top: 2px; letter-spacing: .04em; text-transform: uppercase; }

  /* ─── PROGRESS ───────────────────────────────────────── */
  .progress-wrap {
    background: var(--navy-mid);
    padding: 10px 32px;
    display: flex; align-items: center; gap: 12px;
  }
  .progress-bar-bg {
    flex: 1; height: 4px; background: rgba(255,255,255,.15); border-radius: 2px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; background: var(--orange); border-radius: 2px;
    transition: width .5s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }
  .progress-label { color: rgba(255,255,255,.6); font-size: 0.72rem; font-weight: 500; white-space: nowrap; }

  /* ─── MAIN ────────────────────────────────────────────── */
  main {
    flex: 1;
    display: flex; flex-direction: column; align-items: center;
    padding: 48px 20px 80px;
  }

  /* ─── BREADCRUMB ─────────────────────────────────────── */
  #breadcrumb {
    width: 100%; max-width: var(--step-w);
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 28px; min-height: 24px;
  }
  .crumb {
    font-size: 0.72rem; font-weight: 500; letter-spacing: .03em;
    color: var(--text-muted); display: flex; align-items: center; gap: 5px;
  }
  .crumb .ans {
    background: var(--navy); color: white;
    padding: 2px 8px; border-radius: 20px; font-size: 0.68rem; font-weight: 600; letter-spacing: .04em;
  }
  .crumb-sep { color: var(--border); }

  /* ─── STEP CARD ──────────────────────────────────────── */
  .step-card {
    width: 100%; max-width: var(--step-w);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 4px 40px rgba(19,41,75,.08);
    overflow: hidden;
    animation: slideIn .35s cubic-bezier(.4,0,.2,1) both;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .step-tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
    padding: 5px 12px; border-radius: 20px; margin-bottom: 18px;
  }
  .tag-question { background: #E8F4F3; color: var(--teal); }
  .tag-result   { background: #FEF3EC; color: var(--orange); }

  .step-body { padding: 36px 40px 40px; }

  .question-text {
    font-family: 'DM Serif Display', serif;
    font-size: 1.65rem; line-height: 1.3;
    color: var(--navy); margin-bottom: 32px;
  }

  /* ─── CHOICES ─────────────────────────────────────────── */
  .choices { display: flex; flex-direction: column; gap: 12px; }
  .choice-btn {
    display: flex; align-items: center; gap: 16px;
    background: white; border: 1.5px solid var(--border);
    border-radius: 12px; padding: 16px 20px;
    cursor: pointer; text-align: left;
    transition: all .18s ease;
    font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 500;
    color: var(--text);
  }
  .choice-btn:hover {
    border-color: var(--navy); background: #f0f4fb;
    transform: translateX(4px);
    box-shadow: 0 2px 12px rgba(19,41,75,.1);
  }
  .choice-icon {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.8rem;
  }
  .icon-yes { background: #E8F4F3; color: var(--teal); }
  .icon-no  { background: #FEF0F0; color: #C0392B; }
  .icon-a   { background: #FEF3EC; color: var(--orange); }
  .icon-b   { background: #EEF3FB; color: var(--navy); }
  .choice-label { flex: 1; }
  .choice-desc { font-size: 0.8rem; font-weight: 400; color: var(--text-muted); margin-top: 2px; }
  .choice-arrow { color: var(--border); font-size: 1.1rem; margin-left: auto; transition: transform .18s; }
  .choice-btn:hover .choice-arrow { transform: translateX(4px); color: var(--navy); }

  /* ─── RESULT ──────────────────────────────────────────── */
  .result-header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    padding: 32px 40px;
    position: relative; overflow: hidden;
  }
  .result-header::after {
    content: '';
    position: absolute; right: -20px; top: -20px;
    width: 160px; height: 160px;
    background: rgba(255,255,255,.04);
    border-radius: 50%;
  }
  .result-eyebrow {
    font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em;
    color: var(--gold); margin-bottom: 10px;
  }
  .result-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem; color: white; line-height: 1.25;
  }

  .result-body { padding: 32px 40px; }

  .result-section {
    margin-bottom: 24px;
  }
  .result-section-label {
    font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-muted); margin-bottom: 10px;
  }

  /* consolidation note */
  .consolidation-card {
    background: #FFF8F0;
    border: 1.5px solid #F5C27A;
    border-radius: 12px; padding: 16px 20px;
    display: flex; gap: 12px; align-items: flex-start;
    margin-bottom: 16px;
  }
  .consolidation-icon { font-size: 1.3rem; flex-shrink: 0; margin-top: 1px; }
  .consolidation-text { font-size: 0.88rem; line-height: 1.5; color: var(--text); }
  .consolidation-text strong { color: var(--navy); }

  /* plan pills */
  .plan-list { display: flex; flex-direction: column; gap: 8px; }
  .plan-item {
    background: white; border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .plan-name { font-weight: 600; font-size: 0.9rem; color: var(--navy); }
  .plan-name abbr { text-decoration: none; font-weight: 700; }
  .plan-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
  .plan-badge {
    font-size: 0.68rem; font-weight: 600; padding: 3px 9px;
    border-radius: 20px; white-space: nowrap; flex-shrink: 0;
  }
  .badge-active   { background: #E8F4F3; color: var(--teal); }
  .badge-expiring { background: #FEF3EC; color: var(--orange); }
  .badge-coming   { background: #EEF3FB; color: var(--navy); }
  .badge-pslf     { background: #F0F8FF; color: #1565C0; }

  /* pay-off options */
  .option-card {
    background: white; border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 18px; margin-bottom: 10px;
  }
  .option-card-title { font-weight: 600; font-size: 0.9rem; color: var(--navy); margin-bottom: 4px; }
  .option-card-desc  { font-size: 0.82rem; line-height: 1.55; color: var(--text-muted); }

  /* disclaimer */
  .disclaimer {
    background: #EEF3FB;
    border-radius: 10px; padding: 14px 18px;
    font-size: 0.8rem; line-height: 1.6; color: var(--text-muted);
    margin-top: 8px;
  }
  .disclaimer strong { color: var(--navy); }

  /* ─── ACTION ROW ──────────────────────────────────────── */
  .action-row {
    padding: 0 40px 32px;
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .btn-back {
    background: transparent; border: 1.5px solid var(--border);
    color: var(--text-muted); padding: 10px 22px; border-radius: 8px;
    cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.88rem; font-weight: 500;
    transition: all .15s;
  }
  .btn-back:hover { border-color: var(--navy); color: var(--navy); }
  .btn-restart {
    background: var(--navy); color: white;
    border: none; padding: 10px 24px; border-radius: 8px;
    cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.88rem; font-weight: 600;
    transition: background .15s;
  }
  .btn-restart:hover { background: var(--navy-light); }
  .btn-simulator {
    background: var(--orange); color: white;
    border: none; padding: 10px 24px; border-radius: 8px;
    cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.88rem; font-weight: 600;
    text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    transition: background .15s;
  }
  .btn-simulator:hover { background: var(--orange-light); }

  /* ─── FOOTER ──────────────────────────────────────────── */
  footer {
    text-align: center; padding: 20px;
    font-size: 0.73rem; color: var(--text-muted);
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--navy); }

  @media (max-width: 600px) {
    .step-body, .result-body, .result-header, .action-row { padding-left: 24px; padding-right: 24px; }
    .question-text { font-size: 1.35rem; }
    header { padding: 16px 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-badge">🎓</div>
  <div>
    <div class="header-title">Student Loan Repayment Wizard</div>
    <div class="header-sub">Find your repayment strategy · Updated for 2025–2026</div>
  </div>
</header>

<div class="progress-wrap">
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">Step 1 of ~4</div>
</div>

<main>
  <div id="breadcrumb" class="breadcrumb"></div>
  <div id="stepContainer"></div>
</main>

<footer>
  Information reflects available options and considerations only — not recommendations. <a href="https://studentaid.gov/loan-simulator/" target="_blank" rel="noopener">Federal Loan Simulator ↗</a> &nbsp;|&nbsp; Talk to a financial coach for personalized advice.
</footer>

<script>
// ─────────────────────────────────────────────
//  DECISION TREE DATA
// ─────────────────────────────────────────────

const tree = {
  id: 'root',
  question: 'Are you taking any federal student loans on or after July 1, 2026?',
  hint: 'This includes new Direct Loans you will receive for upcoming enrollment.',
  choices: [
    {
      label: 'No', sublabel: 'All my loans were taken before July 1, 2026',
      icon: 'icon-no', letter: 'No',
      next: {
        id: 'pslf_old',
        question: 'Are you pursuing Public Service Loan Forgiveness (PSLF)?',
        hint: 'PSLF requires 10 years of qualifying payments while working full-time for a qualifying public service employer.',
        choices: [
          {
            label: 'Yes — I plan to pursue PSLF', icon: 'icon-yes', letter: 'Yes',
            next: {
              id: 'ffelp_old_pslf',
              question: 'Do you have any FFELP or Perkins Loans?',
              hint: 'FFELP (Federal Family Education Loan Program) and Perkins Loans are older loan types that are not directly eligible for PSLF or most IDR plans without consolidation.',
              choices: [
                {
                  label: 'Yes — I have FFELP or Perkins Loans', icon: 'icon-yes', letter: 'Yes',
                  next: { id: 'result_old_pslf_ffelp', type: 'result' }
                },
                {
                  label: 'No — I only have Direct Loans', icon: 'icon-no', letter: 'No',
                  next: { id: 'result_old_pslf_no_ffelp', type: 'result' }
                }
              ]
            }
          },
          {
            label: 'No — I am not pursuing PSLF', icon: 'icon-no', letter: 'No',
            next: {
              id: 'goal_old',
              question: 'What is your primary repayment goal?',
              hint: 'Choose the goal that matters most to you right now.',
              choices: [
                {
                  label: 'Pay off / pay down loans as fast as possible',
                  sublabel: 'Minimize total interest paid over time',
                  icon: 'icon-a', letter: 'Pay Off',
                  next: { id: 'result_payoff', type: 'result' }
                },
                {
                  label: 'Minimize my monthly payment',
                  sublabel: 'Keep payments affordable now',
                  icon: 'icon-b', letter: 'Minimize',
                  next: {
                    id: 'ffelp_old_no_pslf',
                    question: 'Do you have any FFELP or Perkins Loans?',
                    hint: 'These older loan types may need to be consolidated before accessing most IDR plans.',
                    choices: [
                      {
                        label: 'Yes — I have FFELP or Perkins Loans', icon: 'icon-yes', letter: 'Yes',
                        next: { id: 'result_old_nopslf_ffelp', type: 'result' }
                      },
                      {
                        label: 'No — I only have Direct Loans', icon: 'icon-no', letter: 'No',
                        next: { id: 'result_old_nopslf_no_ffelp', type: 'result' }
                      }
                    ]
                  }
                }
              ]
            }
          }
        ]
      }
    },
    {
      label: 'Yes', sublabel: 'I have or will have loans on/after July 1, 2026',
      icon: 'icon-yes', letter: 'Yes',
      next: {
        id: 'pslf_new',
        question: 'Are you pursuing Public Service Loan Forgiveness (PSLF)?',
        hint: 'PSLF requires 10 years of qualifying payments while working full-time for a qualifying public service employer.',
        choices: [
          {
            label: 'No — I am not pursuing PSLF', icon: 'icon-no', letter: 'No',
            next: {
              id: 'goal_new',
              question: 'What is your primary repayment goal?',
              hint: 'Choose the goal that matters most to you right now.',
              choices: [
                {
                  label: 'Pay off / pay down loans as fast as possible',
                  sublabel: 'Minimize total interest paid over time',
                  icon: 'icon-a', letter: 'Pay Off',
                  next: { id: 'result_payoff', type: 'result' }
                },
                {
                  label: 'Minimize my monthly payment',
                  sublabel: 'Keep payments affordable now',
                  icon: 'icon-b', letter: 'Minimize',
                  next: {
                    id: 'ffelp_new_no_pslf',
                    question: 'Do you have any FFELP or Perkins Loans?',
                    hint: 'These older loan types may need to be consolidated before accessing most IDR plans.',
                    choices: [
                      {
                        label: 'Yes — I have FFELP or Perkins Loans', icon: 'icon-yes', letter: 'Yes',
                        next: { id: 'result_new_nopslf_ffelp', type: 'result' }
                      },
                      {
                        label: 'No — I only have Direct Loans', icon: 'icon-no', letter: 'No',
                        next: { id: 'result_new_nopslf_no_ffelp', type: 'result' }
                      }
                    ]
                  }
                }
              ]
            }
          },
          {
            label: 'Yes — I plan to pursue PSLF', icon: 'icon-yes', letter: 'Yes',
            next: {
              id: 'ffelp_new_pslf',
              question: 'Do you have any FFELP or Perkins Loans?',
              hint: 'FFELP and Perkins Loans must typically be consolidated to qualify for PSLF.',
              choices: [
                {
                  label: 'No — I only have Direct Loans', icon: 'icon-no', letter: 'No',
                  next: { id: 'result_new_pslf_no_ffelp', type: 'result' }
                },
                {
                  label: 'Yes — I have FFELP or Perkins Loans', icon: 'icon-yes', letter: 'Yes',
                  next: { id: 'result_new_pslf_ffelp', type: 'result' }
                }
              ]
            }
          }
        ]
      }
    }
  ]
};

// ─────────────────────────────────────────────
//  RESULT CONTENT
// ─────────────────────────────────────────────

const plans_full_idr = [
  { name: 'Pay As You Earn', abbr: 'PAYE', sub: 'Payments capped at 10% of discretionary income', badge: 'badge-expiring', badgeText: 'Until July 2028' },
  { name: 'Income-Contingent Repayment', abbr: 'ICR', sub: 'Payments at 20% of discretionary income or fixed 12-year amount', badge: 'badge-expiring', badgeText: 'Until July 2028' },
  { name: 'Income-Based Repayment', abbr: 'IBR', sub: 'Payments capped at 10–15% of discretionary income', badge: 'badge-active', badgeText: 'Available' },
  { name: 'Repayment Assistance Plan', abbr: 'RAP', sub: 'No payment cap — may be higher than Standard Repayment', badge: 'badge-coming', badgeText: 'When Launched' },
];
const plans_rap_only = [
  { name: 'Repayment Assistance Plan', abbr: 'RAP', sub: 'No payment cap — may result in higher monthly payments than Standard Repayment. Check your numbers carefully.', badge: 'badge-coming', badgeText: 'When Launched' },
];

const results = {

  result_old_pslf_ffelp: {
    title: 'PSLF Path — with FFELP/Perkins Loans',
    summary: 'Because you have FFELP or Perkins Loans, you\'ll need to consolidate before accessing PSLF-eligible repayment plans.',
    consolidation: true,
    plans: plans_full_idr,
    pslfNote: true
  },

  result_old_pslf_no_ffelp: {
    title: 'PSLF Path — Direct Loans Only',
    summary: 'Great news — your Direct Loans are already eligible for PSLF. Choose from the income-driven repayment plans below.',
    consolidation: false,
    plans: plans_full_idr,
    pslfNote: true
  },

  result_payoff: {
    title: 'Pay Off Loans As Fast As Possible',
    summary: 'Prioritizing speed means paying more than the minimum. Here are the options and trade-offs to consider.',
    payoff: true
  },

  result_old_nopslf_ffelp: {
    title: 'Minimize Monthly Payment — with FFELP/Perkins Loans',
    summary: 'To access Income-Driven Repayment plans, you\'ll first need to consolidate your FFELP or Perkins Loans.',
    consolidation: true,
    plans: plans_full_idr,
    pslfNote: false
  },

  result_old_nopslf_no_ffelp: {
    title: 'Minimize Monthly Payment — Direct Loans Only',
    summary: 'Your Direct Loans are already eligible for income-driven repayment. Compare these options to find the lowest payment.',
    consolidation: false,
    plans: plans_full_idr,
    pslfNote: false
  },

  result_new_nopslf_ffelp: {
    title: 'New Loans · Minimize Payment — with FFELP/Perkins',
    summary: 'For loans on/after July 1, 2026, the available income-driven option is RAP. You\'ll also need to consolidate older FFELP/Perkins Loans.',
    consolidation: true,
    plans: plans_rap_only,
    pslfNote: false
  },

  result_new_nopslf_no_ffelp: {
    title: 'New Loans · Minimize Monthly Payment',
    summary: 'For loans taken on or after July 1, 2026, the primary income-driven plan available is the Repayment Assistance Plan (RAP).',
    consolidation: false,
    plans: plans_rap_only,
    pslfNote: false
  },

  result_new_pslf_no_ffelp: {
    title: 'New Loans · PSLF Path — Direct Loans Only',
    summary: 'For loans taken on/after July 1, 2026, the PSLF-eligible income-driven option is the Repayment Assistance Plan (RAP).',
    consolidation: false,
    plans: plans_rap_only,
    pslfNote: true
  },

  result_new_pslf_ffelp: {
    title: 'New Loans · PSLF Path — with FFELP/Perkins',
    summary: 'You\'ll need to consolidate your FFELP/Perkins Loans. For new loans on/after July 1, 2026, only RAP is available for PSLF.',
    consolidation: true,
    plans: plans_rap_only,
    pslfNote: true
  }
};

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────

let history = []; // { node, choiceLabel, choiceLetter }

function currentNode() {
  if (history.length === 0) return tree;
  return history[history.length - 1].node;
}

// ─────────────────────────────────────────────
//  RENDER
// ─────────────────────────────────────────────

function render() {
  const node = currentNode();
  updateProgress();
  renderBreadcrumb();
  if (node.type === 'result') {
    renderResult(node.id);
  } else {
    renderQuestion(node);
  }
}

function updateProgress() {
  const node = currentNode();
  const depth = history.length;
  const maxDepth = 4;
  const pct = node.type === 'result' ? 100 : Math.round((depth / maxDepth) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  const label = node.type === 'result'
    ? 'Complete ✓'
    : `Step ${depth + 1} of ~${maxDepth}`;
  document.getElementById('progressLabel').textContent = label;
}

function renderBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (history.length === 0) { bc.innerHTML = ''; return; }
  bc.innerHTML = history.map((h, i) => {
    const sep = i < history.length - 1 ? '<span class="crumb-sep"> › </span>' : '';
    return `<span class="crumb"><span class="ans">${h.choiceLetter}</span>${sep}</span>`;
  }).join('');
}

function renderQuestion(node) {
  const sc = document.getElementById('stepContainer');
  sc.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'step-card';

  const choicesHtml = node.choices.map((c, i) => `
    <button class="choice-btn" onclick="choose(${i})" aria-label="${c.label}">
      <div class="choice-icon ${c.icon}">${c.letter === 'Yes' ? '✓' : c.letter === 'No' ? '✕' : (i === 0 ? 'A' : 'B')}</div>
      <div class="choice-label">
        <div>${c.label}</div>
        ${c.sublabel ? `<div class="choice-desc">${c.sublabel}</div>` : ''}
      </div>
      <div class="choice-arrow">→</div>
    </button>
  `).join('');

  card.innerHTML = `
    <div class="step-body">
      <div class="step-tag tag-question">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><circle cx="5" cy="5" r="5"/></svg>
        Question ${history.length + 1}
      </div>
      <div class="question-text">${node.question}</div>
      ${node.hint ? `<p style="font-size:.84rem;color:var(--text-muted);line-height:1.6;margin-bottom:24px;">${node.hint}</p>` : ''}
      <div class="choices">${choicesHtml}</div>
    </div>
    ${history.length > 0 ? `
    <div class="action-row" style="padding-top:0;padding-bottom:20px;border-top:1px solid var(--border);">
      <button class="btn-back" onclick="goBack()">← Back</button>
    </div>` : ''}
  `;
  sc.appendChild(card);
}

function renderResult(id) {
  const r = results[id];
  const sc = document.getElementById('stepContainer');
  sc.innerHTML = '';

  let plansHtml = '';
  if (r.plans) {
    plansHtml = `
      <div class="result-section">
        <div class="result-section-label">${r.pslfNote ? 'PSLF-Eligible Income-Driven Repayment Plans' : 'Available Income-Driven Repayment (IDR) Plans'}</div>
        <div class="plan-list">
          ${r.plans.map(p => `
            <div class="plan-item">
              <div>
                <div class="plan-name"><abbr>${p.abbr}</abbr> — ${p.name}</div>
                <div class="plan-sub">${p.sub}</div>
              </div>
              <span class="plan-badge ${p.badge}">${p.badgeText}</span>
            </div>
          `).join('')}
        </div>
        ${r.plans.length > 1 ? `
        <p style="font-size:.78rem;color:var(--text-muted);margin-top:10px;line-height:1.5;">
          <strong style="color:var(--navy);">Note:</strong> IBR, PAYE, and RAP may yield different monthly payment amounts depending on your income and age of your oldest loans. Run the numbers to determine the lowest option for your situation.
        </p>` : ''}
      </div>
    `;
  }

  let consolidationHtml = '';
  if (r.consolidation) {
    consolidationHtml = `
      <div class="result-section">
        <div class="result-section-label">First Step</div>
        <div class="consolidation-card">
          <div class="consolidation-icon">⚠️</div>
          <div class="consolidation-text">
            <strong>Direct Loan Consolidation</strong> for your FFELP and/or Perkins Loans is needed before accessing the plans below. Weigh the pros and cons carefully — consolidation can affect your payment history and interest rate.
          </div>
        </div>
      </div>
    `;
  }

  let payoffHtml = '';
  if (r.payoff) {
    payoffHtml = `
      <div class="result-section">
        <div class="result-section-label">Options & Considerations</div>
        <div class="option-card">
          <div class="option-card-title">📅 Standard Repayment + Extra Principal Payments</div>
          <div class="option-card-desc">Enroll in the Standard 10-Year Repayment Plan and pay more than the required monthly amount. Make sure to tell your loan servicer to apply extra payments to your <em>principal balance</em> — not future interest.</div>
        </div>
        <div class="option-card">
          <div class="option-card-title">🏦 Refinancing with a Private Loan</div>
          <div class="option-card-desc">Refinancing to a lower interest rate can save money, but you <strong>permanently lose access to federal benefits</strong> like IDR plans, PSLF, and federal deferment/forbearance. Weigh this trade-off carefully.</div>
        </div>
      </div>
    `;
  }

  if (r.pslfNote) {
    plansHtml += `
      <div class="disclaimer">
        <strong>PSLF Reminder:</strong> To qualify, you must make 10 years (120) of qualifying monthly payments under a qualifying repayment plan while working full-time for a qualifying employer. Only Direct Loans held by the Department of Education are eligible. <a href="https://studentaid.gov/manage-loans/forgiveness-cancellation/public-service" target="_blank" rel="noopener" style="color:var(--navy);">Learn more ↗</a>
      </div>
    `;
  }

  const card = document.createElement('div');
  card.className = 'step-card';
  card.innerHTML = `
    <div class="result-header">
      <div class="result-eyebrow">Your Repayment Strategy</div>
      <div class="result-title">${r.title}</div>
    </div>
    <div class="result-body">
      <div class="step-tag tag-result">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><circle cx="5" cy="5" r="5"/></svg>
        Recommendation
      </div>
      <p style="font-size:.95rem;line-height:1.65;color:var(--text);margin-bottom:24px;">${r.summary}</p>
      ${consolidationHtml}
      ${plansHtml}
      ${payoffHtml}
      <div class="disclaimer" style="margin-top:16px;">
        <strong>Note:</strong> Information shown reflects available options and considerations only, and should not be construed as financial or legal advice. Talk to a coach to determine the best strategy for your specific situation.
      </div>
    </div>
    <div class="action-row">
      <button class="btn-back" onclick="goBack()">← Back</button>
      <button class="btn-restart" onclick="restart()">↺ Start Over</button>
      <a class="btn-simulator" href="https://studentaid.gov/loan-simulator/" target="_blank" rel="noopener">
        Loan Simulator ↗
      </a>
    </div>
  `;
  sc.appendChild(card);
}

// ─────────────────────────────────────────────
//  NAVIGATION
// ─────────────────────────────────────────────

function choose(idx) {
  const node = currentNode();
  const choice = node.choices[idx];
  history.push({
    node: choice.next,
    choiceLabel: choice.label,
    choiceLetter: choice.letter
  });
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goBack() {
  if (history.length > 0) history.pop();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  history = [];
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── INIT ────────────────────────────────────
render();
</script>
</body>
</html>
